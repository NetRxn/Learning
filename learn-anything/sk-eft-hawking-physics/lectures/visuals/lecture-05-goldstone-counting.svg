<svg viewBox="0 0 700 380" width="700" height="380" xmlns="http://www.w3.org/2000/svg">
  <title>Goldstone Mode Counting</title>

  <!-- Background -->
  <rect width="700" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">Goldstone Mode Counting: # Massless Modes = # Broken Generators</text>

  <!-- Table structure -->
  <!-- Header row -->
  <rect x="20" y="55" width="150" height="40" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <rect x="170" y="55" width="130" height="40" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <rect x="300" y="55" width="140" height="40" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <rect x="440" y="55" width="240" height="40" fill="#f9fafb" stroke="#374151" stroke-width="1"/>

  <text x="95" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Original Symmetry</text>
  <text x="235" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Broken To</text>
  <text x="370" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151"># Broken Generators</text>
  <text x="560" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Goldstone Modes</text>

  <!-- Row 1: U(1) → Z₁ (Blue) -->
  <rect x="20" y="95" width="15" height="55" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="2"/>
  <rect x="35" y="95" width="135" height="55" fill="rgba(37,99,235,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="170" y="95" width="130" height="55" fill="rgba(37,99,235,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="300" y="95" width="140" height="55" fill="rgba(37,99,235,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="440" y="95" width="240" height="55" fill="rgba(37,99,235,0.04)" stroke="#374151" stroke-width="1"/>

  <text x="100" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">U(1)</text>
  <text x="235" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">Nothing (Z₁)</text>
  <text x="370" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">1</text>
  <text x="560" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="bold">1 phonon</text>

  <!-- Row 2: SO(3) → SO(2) (Green) -->
  <rect x="20" y="150" width="15" height="55" fill="rgba(22,163,74,0.12)" stroke="#16a34a" stroke-width="2"/>
  <rect x="35" y="150" width="135" height="55" fill="rgba(22,163,74,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="170" y="150" width="130" height="55" fill="rgba(22,163,74,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="300" y="150" width="140" height="55" fill="rgba(22,163,74,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="440" y="150" width="240" height="55" fill="rgba(22,163,74,0.04)" stroke="#374151" stroke-width="1"/>

  <text x="100" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">SO(3)</text>
  <text x="235" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">SO(2)</text>
  <text x="370" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">2</text>
  <text x="560" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="bold">2 spin waves</text>

  <!-- Row 3: GL(4,ℝ) → SO(3,1) (Purple) -->
  <rect x="20" y="205" width="15" height="55" fill="rgba(147,51,234,0.12)" stroke="#9333ea" stroke-width="2"/>
  <rect x="35" y="205" width="135" height="55" fill="rgba(147,51,234,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="170" y="205" width="130" height="55" fill="rgba(147,51,234,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="300" y="205" width="140" height="55" fill="rgba(147,51,234,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="440" y="205" width="240" height="55" fill="rgba(147,51,234,0.04)" stroke="#374151" stroke-width="1"/>

  <text x="100" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">GL(4,ℝ)</text>
  <text x="235" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">SO(3,1)</text>
  <text x="370" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">6</text>
  <text x="560" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9333ea" font-weight="bold">2 gravitons</text>

  <!-- Row 4: SU(2)×SU(2) → SU(2) (Amber) -->
  <rect x="20" y="260" width="15" height="55" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="2"/>
  <rect x="35" y="260" width="135" height="55" fill="rgba(217,119,6,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="170" y="260" width="130" height="55" fill="rgba(217,119,6,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="300" y="260" width="140" height="55" fill="rgba(217,119,6,0.04)" stroke="#374151" stroke-width="1"/>
  <rect x="440" y="260" width="240" height="55" fill="rgba(217,119,6,0.04)" stroke="#374151" stroke-width="1"/>

  <text x="100" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">SU(2)×SU(2)</text>
  <text x="235" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">SU(2)</text>
  <text x="370" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">3</text>
  <text x="560" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d97706" font-weight="bold">3 pions</text>

  <!-- Footer note -->
  <rect x="20" y="335" width="660" height="35" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,4" rx="4"/>
  <text x="350" y="355" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#374151">Goldstone's Theorem: Each broken generator produces one massless mode</text>
  <text x="350" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">Cost of creating the Goldstone boson vanishes as momentum → 0</text>
</svg>