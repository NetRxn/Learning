<svg viewBox="0 0 600 650" width="600" height="650" xmlns="http://www.w3.org/2000/svg">
  <title>The SSB Hierarchy in the Research Program</title>

  <!-- Background -->
  <rect width="600" height="650" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">Spontaneous Symmetry Breaking Hierarchy</text>

  <!-- Level 1 Box (Blue) -->
  <rect x="50" y="70" width="500" height="110" rx="8" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="2.5"/>
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">Level 1: Superfluid EFT</text>
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="12" fill="#374151">U(1) breaks → Phonon (Goldstone)</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Son's Superfluid EFT, Effective Lagrangian: L = P(X)</text>
  <text x="70" y="157" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Single massless mode from symmetry breaking</text>

  <!-- Arrow down to Level 2 -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9333ea" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a" />
    </marker>
  </defs>
  <line x1="300" y1="185" x2="300" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Level 2 Box (Purple) -->
  <rect x="50" y="215" width="500" height="110" rx="8" fill="rgba(147,51,234,0.08)" stroke="#9333ea" stroke-width="2.5"/>
  <text x="70" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">Level 2: Graviton from SSB</text>
  <text x="70" y="265" font-family="Arial, sans-serif" font-size="12" fill="#374151">GL(4,ℝ) → SO(3,1) breaks → Graviton (Goldstone)</text>
  <text x="70" y="285" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">ADW mechanism (Paper 4): Tetrad condensate</text>
  <text x="70" y="302" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Massless graviton from breaking spacetime translational symmetry</text>

  <!-- Arrow down to Level 3 -->
  <line x1="300" y1="330" x2="300" y2="360" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- Level 3 Box (Green) -->
  <rect x="50" y="360" width="500" height="110" rx="8" fill="rgba(22,163,74,0.08)" stroke="#16a34a" stroke-width="2.5"/>
  <text x="70" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">Level 3: Vestigial Phases & Partial Breaking</text>
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="12" fill="#374151">Staged symmetry breaking with intermediate phases</text>
  <text x="70" y="430" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Paper 6 (MC): Only composite order condenses first</text>
  <text x="70" y="447" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Multiple phase transitions encode information about UV completion</text>

  <!-- Unifying annotation box (right side) -->
  <rect x="50" y="500" width="500" height="110" rx="8" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="70" y="525" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Unifying Mechanism Across Scales</text>
  <text x="70" y="545" font-family="Arial, sans-serif" font-size="11" fill="#374151">• Symmetry breaks → massless Goldstone modes appear</text>
  <text x="70" y="562" font-family="Arial, sans-serif" font-size="11" fill="#374151">• Goldstone becomes the effective "geometry" (phonons, gravitons, etc.)</text>
  <text x="70" y="579" font-family="Arial, sans-serif" font-size="11" fill="#374151">• EFT captures low-energy physics independent of UV details</text>
  <text x="70" y="596" font-family="Arial, sans-serif" font-size="11" fill="#374151">• Same pattern repeats at each tier of the hierarchy</text>
</svg>