<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <title>The Paper 1 Argument Flow: From Fluid Dynamics to Dissipative Corrections</title>

  <!-- Background -->
  <rect width="600" height="900" fill="#ffffff"/>

  <!-- Defs for arrow markers -->
  <defs>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Main chain (blue) -->
  <!-- Box 1: Flowing Fluid -->
  <rect x="100" y="50" width="400" height="60" rx="8" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="87" font-family="Arial, sans-serif" font-size="13" fill="#374151" font-weight="bold" text-anchor="middle">Flowing Fluid (Euler Equations)</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="110" x2="300" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <!-- Box 2: Linearize -->
  <rect x="100" y="140" width="400" height="60" rx="8" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="177" font-family="Arial, sans-serif" font-size="13" fill="#374151" font-weight="bold" text-anchor="middle">Linearize Perturbations</text>

  <!-- Arrow 2 -->
  <line x1="300" y1="200" x2="300" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <!-- Box 3: Acoustic Metric -->
  <rect x="100" y="230" width="400" height="60" rx="8" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="267" font-family="Arial, sans-serif" font-size="13" fill="#374151" font-weight="bold" text-anchor="middle">Acoustic Metric Emerges</text>

  <!-- Arrow 3 -->
  <line x1="300" y1="290" x2="300" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <!-- Box 4: Horizon -->
  <rect x="100" y="320" width="400" height="60" rx="8" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="357" font-family="Arial, sans-serif" font-size="13" fill="#374151" font-weight="bold" text-anchor="middle">Horizon where v = c_s</text>

  <!-- Arrow 4 -->
  <line x1="300" y1="380" x2="300" y2="410" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <!-- Box 5: Hawking Radiation -->
  <rect x="100" y="410" width="400" height="60" rx="8" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="440" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">Hawking Radiation</text>
  <text x="300" y="458" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">T_H = ℏκ/2πk_B</text>

  <!-- Branching point (visual separator) -->
  <line x1="50" y1="520" x2="550" y2="520" stroke="#374151" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Branch label -->
  <text x="300" y="545" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-style="italic" text-anchor="middle">Adding Dissipation (Real Fluids)</text>

  <!-- Box 6: Add Viscosity (green branch) -->
  <rect x="100" y="560" width="400" height="60" rx="8" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="597" font-family="Arial, sans-serif" font-size="13" fill="#374151" font-weight="bold" text-anchor="middle">Add Viscosity (Real Fluids)</text>

  <!-- Arrow 5 (green) -->
  <line x1="300" y1="620" x2="300" y2="650" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Box 7: SK Formalism -->
  <rect x="100" y="650" width="400" height="60" rx="8" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="680" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">SK Formalism: Doubled Degrees</text>
  <text x="300" y="698" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">of Freedom</text>

  <!-- Arrow 6 (green) -->
  <line x1="300" y1="710" x2="300" y2="740" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Box 8: Three Axioms -->
  <rect x="100" y="740" width="400" height="60" rx="8" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="767" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">Three Axioms Constrain</text>
  <text x="300" y="785" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">(Normalization, Positivity, KMS)</text>

  <!-- Arrow 7 (green) -->
  <line x1="300" y1="800" x2="300" y2="830" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Box 9: Dissipative Correction -->
  <rect x="100" y="830" width="400" height="60" rx="8" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="860" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">Dissipative Correction</text>
  <text x="300" y="878" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">δ_diss = Γ_H/κ</text>

</svg>
