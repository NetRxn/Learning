<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" width="700" height="500">
  <title>Fermat's Principle: Lifeguard Parable</title>

  <!-- Sand region (top half) -->
  <rect x="0" y="0" width="700" height="250" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>

  <!-- Water region (bottom half) -->
  <rect x="0" y="250" width="700" height="250" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2"/>

  <!-- Boundary line between sand and water -->
  <line x1="0" y1="250" x2="700" y2="250" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Starting position (lifeguard) -->
  <circle cx="80" cy="60" r="8" fill="#374151" stroke="#374151" stroke-width="2"/>
  <text x="80" y="90" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">A (Lifeguard)</text>

  <!-- Ending position (drowning person) -->
  <circle cx="620" cy="420" r="8" fill="#374151" stroke="#374151" stroke-width="2"/>
  <text x="620" y="450" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">B (Drowning)</text>

  <!-- Path 1: Straight line (shortest distance, slowest) -->
  <line x1="80" y1="60" x2="620" y2="420" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="250" y="150" font-size="12" fill="#374151">Shortest distance</text>
  <text x="250" y="168" font-size="12" fill="#374151">(slow)</text>

  <!-- Path 2: Optimal refraction path (least time - green) -->
  <path d="M 80 60 Q 280 180, 380 250 Q 500 310, 620 420" fill="none" stroke="#16a34a" stroke-width="3.5"/>
  <text x="350" y="280" font-size="12" font-weight="bold" fill="#16a34a">Least time</text>
  <text x="350" y="296" font-size="12" font-weight="bold" fill="#16a34a">(Snell's law)</text>

  <!-- Path 3: All sand then all water (inefficient) -->
  <path d="M 80 60 L 620 240 L 620 420" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="530" y="220" font-size="11" fill="#374151">All sand</text>
  <text x="530" y="360" font-size="11" fill="#374151">then all water</text>
  <text x="530" y="376" font-size="11" fill="#374151">(longest)</text>

  <!-- Mark refraction angle -->
  <line x1="380" y1="250" x2="380" y2="320" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="395" y="290" font-size="11" fill="#374151">refraction</text>
  <text x="395" y="305" font-size="11" fill="#374151">angle</text>

  <!-- Labels for regions -->
  <text x="50" y="150" font-size="13" font-weight="bold" fill="#d97706">Sand</text>
  <text x="50" y="168" font-size="13" font-weight="bold" fill="#d97706">(slow running)</text>

  <text x="50" y="350" font-size="13" font-weight="bold" fill="#2563eb">Water</text>
  <text x="50" y="368" font-size="13" font-weight="bold" fill="#2563eb">(slow swimming)</text>
</svg>
