<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" width="800" height="450">
  <title>de Laval Nozzle: Acoustic Black Hole and Transonic Flow</title>
  <defs>
    <style>
      .label { font-family: sans-serif; font-size: 14px; fill: #374151; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #374151; }
      .equation { font-family: monospace; font-size: 13px; fill: #374151; }
      .annotation { font-family: sans-serif; font-size: 12px; fill: #374151; }
    </style>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">de Laval Nozzle: Acoustic Black Hole</text>

  <!-- Top section: Nozzle geometry -->
  <g id="nozzle-section">
    <!-- Incoming flow label -->
    <text x="60" y="80" class="annotation">Subsonic flow</text>

    <!-- Nozzle profile (converging-diverging) -->
    <!-- Left side (converging) -->
    <path d="M 100 60 L 300 120" stroke="#374151" stroke-width="2" fill="none"/>
    <path d="M 100 180 L 300 120" stroke="#374151" stroke-width="2" fill="none"/>

    <!-- Throat (narrowest point at x=300) -->
    <circle cx="300" cy="120" r="3" fill="#dc2626"/>

    <!-- Right side (diverging) -->
    <path d="M 300 120 L 500 60" stroke="#374151" stroke-width="2" fill="none"/>
    <path d="M 300 120 L 500 180" stroke="#374151" stroke-width="2" fill="none"/>

    <!-- Subsonic flow arrows (blue) in converging section -->
    <path d="M 140 120 L 180 120" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>
    <path d="M 200 120 L 240 120" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>

    <!-- Supersonic flow arrows (red) in diverging section -->
    <path d="M 340 120 L 400 120" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrowred)"/>
    <path d="M 420 120 L 480 120" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrowred)"/>

    <!-- Sonic line at throat -->
    <line x1="300" y1="100" x2="300" y2="140" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Sonic point label -->
    <text x="310" y="105" class="annotation">v = c_s (sonic)</text>

    <!-- Subsonic region label -->
    <text x="190" y="220" class="label">Subsonic (v < c_s)</text>

    <!-- Supersonic region label -->
    <text x="380" y="220" class="label">Supersonic (v > c_s)</text>

    <!-- Event horizon analogy -->
    <text x="300" y="250" class="annotation" text-anchor="middle" font-style="italic">Acoustic event horizon</text>
  </g>

  <!-- Bottom section: Velocity profile plot -->
  <g id="velocity-plot">
    <!-- Axes -->
    <line x1="80" y1="350" x2="750" y2="350" stroke="#374151" stroke-width="2"/>
    <line x1="80" y1="280" x2="80" y2="350" stroke="#374151" stroke-width="2"/>

    <!-- Axis labels -->
    <text x="755" y="355" class="label">x (position)</text>
    <text x="30" y="290" class="label">v/c_s</text>

    <!-- Grid lines -->
    <line x1="80" y1="315" x2="750" y2="315" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="75" y="320" class="annotation" text-anchor="end" font-size="11">1.0</text>

    <!-- Sonic line on plot -->
    <line x1="300" y1="280" x2="300" y2="350" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Velocity curve: subsonic region (below 1.0) -->
    <path d="M 100 330 Q 200 320 300 315" stroke="#2563eb" stroke-width="2.5" fill="none"/>

    <!-- Velocity curve: supersonic region (above 1.0) -->
    <path d="M 300 315 Q 400 305 500 280" stroke="#dc2626" stroke-width="2.5" fill="none"/>

    <!-- Curve asymptote -->
    <path d="M 500 280 L 650 250" stroke="#dc2626" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="3,3"/>

    <!-- Mark the sonic point on curve -->
    <circle cx="300" cy="315" r="4" fill="#dc2626"/>

    <!-- Annotation at sonic point -->
    <text x="305" y="305" class="annotation">Sonic point</text>

    <!-- Label subsonic region of curve -->
    <text x="200" y="345" class="annotation" fill="#2563eb">v &lt; c_s</text>

    <!-- Label supersonic region of curve -->
    <text x="420" y="265" class="annotation" fill="#dc2626">v &gt; c_s</text>
  </g>

  <!-- Bottom annotation -->
  <text x="400" y="420" class="label" text-anchor="middle" font-style="italic">This is your acoustic black hole: fluid cannot escape supersonic region</text>
</svg>