<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <title>Penrose Diagram of an Acoustic Black Hole</title>

  <!-- Background -->
  <rect width="500" height="500" fill="#ffffff"/>

  <!-- Outer diamond boundary -->
  <polygon points="250,50 450,250 250,450 50,250" fill="#f9fafb" stroke="#374151" stroke-width="2"/>

  <!-- Horizon line (diagonal from lower-left to upper-right) -->
  <line x1="80" y1="420" x2="420" y2="80" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Left edge: past null infinity -->
  <line x1="50" y1="250" x2="100" y2="300" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
  <text x="20" y="260" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="end">
    i⁻ (past)
  </text>

  <!-- Right edge: future null infinity -->
  <line x1="400" y1="200" x2="450" y2="250" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
  <text x="480" y="260" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="start">
    i⁺ (future)
  </text>

  <!-- Region labels -->
  <text x="150" y="200" font-family="Arial, sans-serif" font-size="13" fill="#374151" font-weight="bold">
    Exterior
  </text>
  <text x="135" y="220" font-family="Arial, sans-serif" font-size="11" fill="#374151">
    (subsonic)
  </text>

  <text x="320" y="280" font-family="Arial, sans-serif" font-size="13" fill="#374151" font-weight="bold">
    Interior
  </text>
  <text x="300" y="300" font-family="Arial, sans-serif" font-size="11" fill="#374151">
    (supersonic)
  </text>

  <!-- Horizon label -->
  <text x="280" y="170" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="bold">
    Horizon: v = c_s
  </text>

  <!-- Escaping sound rays (exterior, blue) -->
  <path d="M 150 300 Q 180 250 220 150" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="220,150 215,162 225,160" fill="#2563eb"/>

  <path d="M 180 320 Q 210 280 250 180" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="250,180 244,192 256,188" fill="#2563eb"/>

  <!-- Trapped sound rays (interior, red) -->
  <path d="M 330 200 Q 310 220 290 300" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="290,300 302,295 296,285" fill="#dc2626"/>

  <path d="M 360 180 Q 340 220 320 320" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="320,320 333,318 324,308" fill="#dc2626"/>

  <!-- Legend -->
  <g transform="translate(50, 430)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2563eb" stroke-width="2"/>
    <text x="35" font-family="Arial, sans-serif" font-size="10" fill="#374151">Escaping rays</text>

    <line x1="0" y1="15" x2="30" y2="15" stroke="#dc2626" stroke-width="2"/>
    <text x="35" font-family="Arial, sans-serif" font-size="10" fill="#374151">Trapped rays</text>
  </g>
</svg>