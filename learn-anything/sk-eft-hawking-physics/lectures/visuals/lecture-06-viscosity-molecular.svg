<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" width="700" height="400">
  <title>Molecular Picture of Viscosity: Kinetic Theory</title>
  <defs>
    <style>
      .label { font-family: sans-serif; font-size: 14px; fill: #374151; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #374151; }
      .equation { font-family: monospace; font-size: 12px; fill: #374151; }
      .annotation { font-family: sans-serif; font-size: 13px; fill: #374151; }
    </style>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" class="title" text-anchor="middle">Molecular Picture of Viscosity</text>

  <!-- Top layer: Fast-moving fluid (blue) -->
  <g id="top-layer">
    <!-- Layer background -->
    <rect x="50" y="60" width="600" height="80" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2" rx="4"/>

    <!-- Layer label -->
    <text x="70" y="85" class="label" font-weight="bold">Fast Layer (v₁)</text>

    <!-- Velocity arrows -->
    <path d="M 200 120 L 280 120" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>
    <path d="M 320 120 L 400 120" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>
    <path d="M 440 120 L 520 120" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>

    <!-- Molecules in fast layer -->
    <circle cx="150" cy="110" r="3" fill="#2563eb"/>
    <circle cx="170" cy="130" r="3" fill="#2563eb"/>
    <circle cx="230" cy="115" r="3" fill="#2563eb"/>
    <circle cx="260" cy="125" r="3" fill="#2563eb"/>
    <circle cx="350" cy="110" r="3" fill="#2563eb"/>
    <circle cx="380" cy="130" r="3" fill="#2563eb"/>
    <circle cx="450" cy="115" r="3" fill="#2563eb"/>
    <circle cx="490" cy="125" r="3" fill="#2563eb"/>
    <circle cx="550" cy="110" r="3" fill="#2563eb"/>
    <circle cx="580" cy="130" r="3" fill="#2563eb"/>
  </g>

  <!-- Middle section: Molecular interaction zone -->
  <g id="interaction-zone">
    <!-- Boundary line -->
    <line x1="50" y1="140" x2="650" y2="140" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Molecules bouncing between layers -->
    <!-- Fast molecule moving down (blue) -->
    <circle cx="180" cy="155" r="2.5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
    <path d="M 180 157 L 180 180" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
    <text x="195" y="170" class="annotation" font-size="11">fast → slow</text>

    <!-- Slow molecule moving up (green) -->
    <circle cx="450" cy="155" r="2.5" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
    <path d="M 450 153 L 450 130" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
    <text x="465" y="150" class="annotation" font-size="11">slow → fast</text>
  </g>

  <!-- Bottom layer: Slow-moving fluid (green) -->
  <g id="bottom-layer">
    <!-- Layer background -->
    <rect x="50" y="220" width="600" height="80" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="2" rx="4"/>

    <!-- Layer label -->
    <text x="70" y="245" class="label" font-weight="bold">Slow Layer (v₂)</text>

    <!-- Velocity arrows (shorter, slower) -->
    <path d="M 200" y1="280" L 260 280" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>
    <path d="M 320" y1="280" L 380 280" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>
    <path d="M 440" y1="280" L 500 280" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrowgreen)"/>

    <!-- Molecules in slow layer -->
    <circle cx="150" cy="270" r="3" fill="#16a34a"/>
    <circle cx="170" cy="290" r="3" fill="#16a34a"/>
    <circle cx="230" cy="275" r="3" fill="#16a34a"/>
    <circle cx="260" cy="285" r="3" fill="#16a34a"/>
    <circle cx="350" cy="270" r="3" fill="#16a34a"/>
    <circle cx="380" cy="290" r="3" fill="#16a34a"/>
    <circle cx="450" cy="275" r="3" fill="#16a34a"/>
    <circle cx="490" cy="285" r="3" fill="#16a34a"/>
    <circle cx="550" cy="270" r="3" fill="#16a34a"/>
    <circle cx="580" cy="290" r="3" fill="#16a34a"/>
  </g>

  <!-- Bottom annotations -->
  <g id="annotations">
    <!-- Left annotation -->
    <text x="50" y="355" class="annotation">Fast molecules entering slow layer → speed it up</text>

    <!-- Right annotation -->
    <text x="50" y="375" class="annotation">Slow molecules entering fast layer → slow it down</text>

    <!-- Viscous stress formula -->
    <g id="formula">
      <text x="50" y="395" class="equation">Net effect: momentum transfer = viscous stress τ = η dv/dy</text>
    </g>
  </g>
</svg>