<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <title>Double Slit Interference Experiment</title>

  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Source on left -->
  <circle cx="50" cy="200" r="8" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="50" cy="200" r="12" fill="none" stroke="#374151" stroke-width="1" opacity="0.5"/>

  <!-- Barrier with two slits -->
  <rect x="200" y="50" width="15" height="140" fill="none" stroke="#374151" stroke-width="2"/>
  <rect x="200" y="210" width="15" height="140" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Wavefronts from slit 1 (top) -->
  <circle cx="215" cy="120" r="30" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/>
  <circle cx="215" cy="120" r="50" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.4"/>
  <circle cx="215" cy="120" r="70" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.3"/>

  <!-- Wavefronts from slit 2 (bottom) -->
  <circle cx="215" cy="280" r="30" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/>
  <circle cx="215" cy="280" r="50" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.4"/>
  <circle cx="215" cy="280" r="70" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.3"/>

  <!-- Detection screen -->
  <rect x="700" y="50" width="20" height="300" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Interference pattern on screen (alternating bright/dark) -->
  <rect x="700" y="50" width="20" height="30" fill="rgba(22,163,74,0.15)" stroke="none"/>
  <rect x="700" y="80" width="20" height="30" fill="rgba(22,163,74,0.05)" stroke="none"/>
  <rect x="700" y="110" width="20" height="30" fill="rgba(22,163,74,0.15)" stroke="none"/>
  <rect x="700" y="140" width="20" height="30" fill="rgba(22,163,74,0.05)" stroke="none"/>
  <rect x="700" y="170" width="20" height="30" fill="rgba(22,163,74,0.15)" stroke="none"/>
  <rect x="700" y="200" width="20" height="30" fill="rgba(22,163,74,0.05)" stroke="none"/>
  <rect x="700" y="230" width="20" height="30" fill="rgba(22,163,74,0.15)" stroke="none"/>
  <rect x="700" y="260" width="20" height="30" fill="rgba(22,163,74,0.05)" stroke="none"/>
  <rect x="700" y="290" width="20" height="30" fill="rgba(22,163,74,0.15)" stroke="none"/>
  <rect x="700" y="320" width="20" height="30" fill="rgba(22,163,74,0.05)" stroke="none"/>

  <!-- Arrows showing particle flow -->
  <path d="M 60 200 L 190 120" stroke="#374151" stroke-width="1.5" fill="none" stroke-dasharray="5,5" opacity="0.5"/>
  <path d="M 60 200 L 190 280" stroke="#374151" stroke-width="1.5" fill="none" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- Arrow from slits to screen -->
  <path d="M 230 200 L 690 200" stroke="#374151" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Labels -->
  <text x="50" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Source</text>

  <text x="207" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Barrier</text>
  <text x="207" y="360" text-anchor="middle" font-size="12" fill="#374151">(two slits)</text>

  <text x="710" y="35" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Screen</text>

  <!-- Explanation text -->
  <text x="400" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">Each particle goes through BOTH slits</text>

  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#374151">Interference pattern: |ψ₁ + ψ₂|² shows constructive (bright) and destructive (dark) bands</text>

  <!-- Legend for wavefronts -->
  <text x="450" y="100" font-size="11" fill="#2563eb" font-weight="bold">Wavefronts from</text>
  <text x="450" y="115" font-size="11" fill="#2563eb" font-weight="bold">each slit overlap</text>
</svg>