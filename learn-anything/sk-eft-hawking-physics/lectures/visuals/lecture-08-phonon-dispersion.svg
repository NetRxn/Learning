<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <title>Phonon Dispersion Relation: Linear EFT Regime and Microscopic Cutoff</title>

  <!-- Background -->
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- Axes -->
  <!-- y-axis (frequency ω) -->
  <line x1="80" y1="320" x2="80" y2="30" stroke="#374151" stroke-width="2"/>
  <polygon points="80,20 75,35 85,35" fill="#374151"/>

  <!-- x-axis (wavenumber k) -->
  <line x1="80" y1="320" x2="650" y2="320" stroke="#374151" stroke-width="2"/>
  <polygon points="660,320 645,315 645,325" fill="#374151"/>

  <!-- Axis labels -->
  <text x="40" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle" transform="rotate(-90 40 170)">ω (frequency)</text>
  <text x="365" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">k (wavenumber)</text>

  <!-- Grid lines and labels -->
  <line x1="75" y1="320" x2="80" y2="320" stroke="#374151" stroke-width="1"/>
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="end">0</text>

  <!-- Linear phonon regime line (green) -->
  <line x1="80" y1="320" x2="420" y2="100" stroke="#16a34a" stroke-width="3"/>

  <!-- Nonlinear curve (blue) departing from linear -->
  <path d="M 420 100 Q 520 80 600 110" stroke="#2563eb" stroke-width="3" fill="none"/>

  <!-- Healing length cutoff line (red dashed) -->
  <line x1="420" y1="30" x2="420" y2="320" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Labels for the curves -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">ω = c_s k</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="11" fill="#374151">(phonon regime)</text>

  <text x="520" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Nonlinear</text>
  <text x="520" y="88" font-family="Arial, sans-serif" font-size="11" fill="#374151">(microscopic)</text>

  <!-- Healing length marker -->
  <text x="420" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">k_ξ = 1/ξ</text>

  <!-- Region labels -->
  <rect x="100" y="15" width="300" height="25" fill="rgba(22,163,74,0.08)" stroke="#16a34a" stroke-width="1"/>
  <text x="250" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">EFT valid: linear phonon regime</text>

  <rect x="440" y="15" width="170" height="25" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1"/>
  <text x="525" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Microscopic cutoff</text>

  <!-- Main annotation -->
  <text x="365" y="380" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">c_s² = P'/(P' + 2XP'') — derived from L=P(X)</text>

  <!-- Legend/caption box -->
  <rect x="20" y="60" width="50" height="20" rx="3" fill="rgba(22,163,74,0.12)" stroke="#16a34a" stroke-width="1"/>
  <text x="45" y="74" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">EFT</text>

  <rect x="20" y="90" width="50" height="20" rx="3" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1"/>
  <text x="45" y="104" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">UV</text>
</svg>