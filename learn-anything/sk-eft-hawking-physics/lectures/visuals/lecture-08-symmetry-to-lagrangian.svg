<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <title>From Symmetry to L=P(X) — Son's Inevitable Lagrangian</title>

  <!-- Background -->
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Step 1: U(1) Symmetry -->
  <rect x="20" y="80" width="140" height="80" rx="8" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Start: U(1)</text>
  <text x="90" y="128" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">symmetry</text>
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">ψ → ψ + c</text>

  <!-- Arrow 1 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#374151"/>
    </marker>
  </defs>
  <line x1="160" y1="120" x2="200" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Invariant X -->
  <rect x="200" y="80" width="140" height="80" rx="8" fill="rgba(22,163,74,0.12)" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Only Invariant:</text>
  <text x="270" y="128" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">X = (∂μψ)²</text>
  <text x="270" y="145" font-family="Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle" font-style="italic">shift kills non-deriv</text>

  <!-- Arrow 2 -->
  <line x1="340" y1="120" x2="380" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: L = P(X) -->
  <rect x="380" y="80" width="140" height="80" rx="8" fill="rgba(147,51,234,0.12)" stroke="#9333ea" stroke-width="2"/>
  <text x="450" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Leading Order:</text>
  <text x="450" y="128" font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle">L = P(X)</text>
  <text x="450" y="145" font-family="Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle" font-style="italic">any function of X</text>

  <!-- Arrow 3 -->
  <line x1="520" y1="120" x2="560" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Thermodynamics -->
  <rect x="560" y="80" width="140" height="80" rx="8" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="2"/>
  <text x="630" y="108" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Thermodynamics:</text>
  <text x="630" y="128" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">P' = ρ, P = pressure</text>
  <text x="630" y="145" font-family="Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle" font-style="italic">encoded in function</text>

  <!-- Bottom insight -->
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Symmetry alone determines the theory — Son's insight</text>
</svg>