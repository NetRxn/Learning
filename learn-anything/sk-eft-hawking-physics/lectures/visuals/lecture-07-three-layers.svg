<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" width="600" height="500">
  <title>Three-Layer Architecture in SK-EFT</title>

  <!-- Background -->
  <rect width="600" height="500" fill="#ffffff"/>

  <!-- Layer 1 (Bottom): Microscopic -->
  <rect x="50" y="350" width="500" height="100" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="2.5" rx="8"/>
  <text x="300" y="380" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Layer 1: Microscopic</text>
  <text x="300" y="402" font-size="11" fill="#374151" text-anchor="middle">BEC atoms / Polariton photons</text>
  <text x="300" y="420" font-size="10" fill="#2563eb" text-anchor="middle" font-style="italic">Full quantum many-body theory</text>

  <!-- Arrow Up (Coarse-grain) -->
  <line x1="200" y1="350" x2="200" y2="310" stroke="#374151" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="210" y="332" font-size="11" fill="#374151" font-weight="bold">Coarse-</text>
  <text x="210" y="347" font-size="11" fill="#374151" font-weight="bold">grain</text>

  <!-- Layer 2 (Middle): EFT -->
  <rect x="50" y="210" width="500" height="100" fill="rgba(22,163,74,0.12)" stroke="#16a34a" stroke-width="2.5" rx="8"/>
  <text x="300" y="240" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Layer 2: Effective Field Theory</text>
  <text x="300" y="262" font-size="11" fill="#374151" text-anchor="middle" font-family="monospace">L = P(X) + SK dissipative terms</text>
  <text x="300" y="280" font-size="10" fill="#16a34a" text-anchor="middle" font-style="italic">Universal: only symmetries matter</text>

  <!-- Arrow Up (Linearize) -->
  <line x1="400" y1="210" x2="400" y2="170" stroke="#374151" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="410" y="192" font-size="11" fill="#374151" font-weight="bold">Linearize</text>

  <!-- Layer 3 (Top): Emergent Geometry -->
  <rect x="50" y="70" width="500" height="100" fill="rgba(147,51,234,0.12)" stroke="#9333ea" stroke-width="2.5" rx="8"/>
  <text x="300" y="100" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Layer 3: Emergent Geometry</text>
  <text x="300" y="122" font-size="11" fill="#374151" text-anchor="middle">Acoustic metric / Hawking radiation</text>
  <text x="300" y="140" font-size="10" fill="#9333ea" text-anchor="middle" font-style="italic">Predictions: T_H, δ_dissipation</text>

  <!-- Side annotation box -->
  <rect x="50" y="415" width="500" height="70" fill="#f9fafb" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="65" y="438" font-size="12" font-weight="bold" fill="#374151">Self-Contained Layers:</text>
  <text x="65" y="458" font-size="11" fill="#374151">Each layer is independent. Layer 3 doesn't need the microscopic details.</text>
  <text x="65" y="475" font-size="11" fill="#374151">Only Layer 2 (EFT) is universal—applicable to any microscopic system!</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#374151"/>
    </marker>
  </defs>
</svg>