<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" width="600" height="500">
  <title>The Four Acoustic Metric Theorems</title>

  <!-- Background -->
  <rect width="600" height="500" fill="#ffffff"/>

  <!-- Left bar: Lean-verified -->
  <rect x="20" y="40" width="40" height="420" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="40" y="260" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="bold" text-anchor="middle" transform="rotate(-90 40 260)">
    Lean-verified
  </text>

  <!-- Checkmark in left bar -->
  <g transform="translate(40, 470)">
    <circle cx="0" cy="0" r="7" fill="none" stroke="#16a34a" stroke-width="2"/>
    <path d="M -3 0 L -1 2 L 3 -2" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Theorem 1 (Blue) -->
  <rect x="80" y="40" width="500" height="100" rx="8" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="65" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">
    Theorem 1: Metric Emergence
  </text>
  <text x="330" y="88" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    Linearized Euler equations
  </text>
  <text x="330" y="108" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    → wave equation with metric g_μν
  </text>

  <!-- Theorem 2 (Green) -->
  <rect x="80" y="155" width="500" height="100" rx="8" fill="rgba(22,163,74,0.08)" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="180" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">
    Theorem 2: Horizon Location
  </text>
  <text x="330" y="203" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    Horizon at v(x) = c_s
  </text>
  <text x="330" y="223" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    Surface gravity κ = dv/dx|_horizon
  </text>

  <!-- Theorem 3 (Purple) -->
  <rect x="80" y="270" width="500" height="100" rx="8" fill="rgba(147,51,234,0.08)" stroke="#9333ea" stroke-width="2"/>
  <text x="330" y="295" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">
    Theorem 3: Conformal Invariance
  </text>
  <text x="330" y="318" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    Hawking temperature depends only
  </text>
  <text x="330" y="338" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    on conformal class (κ)
  </text>

  <!-- Theorem 4 (Amber) -->
  <rect x="80" y="385" width="500" height="100" rx="8" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="2"/>
  <text x="330" y="410" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">
    Theorem 4: Robustness
  </text>
  <text x="330" y="433" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    Result independent of EOS details
  </text>
  <text x="330" y="453" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    (universality)
  </text>

  <!-- Arrows connecting theorems -->
  <defs>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#374151" opacity="0.4"/>
    </marker>
  </defs>

  <line x1="40" y1="145" x2="40" y2="155" stroke="#374151" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-down)"/>
  <line x1="40" y1="260" x2="40" y2="270" stroke="#374151" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-down)"/>
  <line x1="40" y1="375" x2="40" y2="385" stroke="#374151" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-down)"/>
</svg>