<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <title>Boltzmann Distribution: Temperature Effect on State Occupation</title>

  <!-- Background -->
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="80" y1="320" x2="650" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="320" x2="80" y2="40" stroke="#374151" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="670" y="330" font-size="14" fill="#374151" font-family="sans-serif">Energy (E)</text>
  <text x="30" y="45" font-size="14" fill="#374151" font-family="sans-serif">P(E)</text>

  <!-- Energy level markers and labels -->
  <text x="140" y="345" font-size="12" fill="#374151" font-family="sans-serif">E₁</text>
  <text x="230" y="345" font-size="12" fill="#374151" font-family="sans-serif">E₂</text>
  <text x="320" y="345" font-size="12" fill="#374151" font-family="sans-serif">E₃</text>
  <text x="410" y="345" font-size="12" fill="#374151" font-family="sans-serif">E₄</text>
  <text x="500" y="345" font-size="12" fill="#374151" font-family="sans-serif">E₅</text>

  <!-- Low temperature curve (blue, steep decay) -->
  <path d="M 130 100 Q 180 140 230 200 T 330 280 T 430 310 T 530 318 T 630 319"
        fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- High temperature curve (red, gradual decay) -->
  <path d="M 130 180 Q 180 210 230 235 T 330 270 T 430 285 T 530 295 T 630 300"
        fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Legend -->
  <g>
    <!-- Cold temperature box -->
    <rect x="380" y="50" width="280" height="70" fill="#f9fafb" stroke="#2563eb" stroke-width="2" rx="4"/>
    <line x1="390" y1="65" x2="420" y2="65" stroke="#2563eb" stroke-width="3"/>
    <text x="430" y="70" font-size="13" fill="#374151" font-family="sans-serif" font-weight="bold">Cold (Low T)</text>
    <text x="430" y="88" font-size="12" fill="#374151" font-family="sans-serif">Most particles in ground state</text>
    <text x="430" y="105" font-size="12" fill="#374151" font-family="sans-serif">Steep exponential decay</text>

    <!-- Hot temperature box -->
    <rect x="380" y="140" width="280" height="70" fill="#f9fafb" stroke="#dc2626" stroke-width="2" rx="4"/>
    <line x1="390" y1="155" x2="420" y2="155" stroke="#dc2626" stroke-width="3"/>
    <text x="430" y="160" font-size="13" fill="#374151" font-family="sans-serif" font-weight="bold">Hot (High T)</text>
    <text x="430" y="178" font-size="12" fill="#374151" font-family="sans-serif">Particles spread across states</text>
    <text x="430" y="195" font-size="12" fill="#374151" font-family="sans-serif">Gradual decay</text>
  </g>

  <!-- Equation annotation -->
  <text x="100" y="30" font-size="14" fill="#374151" font-family="monospace" font-weight="bold">P(E) ∝ e^(-E/k_BT)</text>
</svg>