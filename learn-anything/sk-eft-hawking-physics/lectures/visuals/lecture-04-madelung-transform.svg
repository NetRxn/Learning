<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <title>Madelung Transform: QM as Fluid Mechanics</title>

  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Left box: Schrödinger Equation -->
  <rect x="30" y="60" width="220" height="200" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2" rx="5"/>

  <text x="140" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Schrödinger Equation</text>

  <text x="140" y="115" text-anchor="middle" font-size="12" fill="#374151" font-family="monospace">iℏ ∂ψ/∂t = Ĥψ</text>

  <text x="140" y="140" text-anchor="middle" font-size="11" fill="#374151">Complex wavefunction</text>

  <text x="140" y="160" text-anchor="middle" font-size="12" fill="#374151" font-family="monospace">ψ = √ρ e^(iS/ℏ)</text>

  <text x="140" y="190" text-anchor="middle" font-size="10" fill="#374151" font-style="italic">where ρ = probability</text>
  <text x="140" y="205" text-anchor="middle" font-size="10" fill="#374151" font-style="italic">S = action</text>

  <!-- Right box: Fluid Equations -->
  <rect x="550" y="60" width="220" height="200" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="2" rx="5"/>

  <text x="660" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Fluid Equations</text>

  <text x="660" y="115" text-anchor="middle" font-size="11" fill="#374151">Continuity:</text>
  <text x="660" y="130" text-anchor="middle" font-size="11" fill="#374151" font-family="monospace">∂ρ/∂t + ∇·(ρv) = 0</text>

  <text x="660" y="160" text-anchor="middle" font-size="11" fill="#374151">Euler + Quantum:</text>
  <text x="660" y="175" text-anchor="middle" font-size="11" fill="#374151" font-family="monospace">∂v/∂t + (v·∇)v = -∇(V+Q)/m</text>

  <text x="660" y="200" text-anchor="middle" font-size="10" fill="#9333ea" font-family="monospace">Q = -ℏ²∇²√ρ/(2m√ρ)</text>

  <!-- Center bidirectional arrow -->
  <path d="M 260 160 L 530 160" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-left)"/>
  <text x="395" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Madelung</text>
  <text x="395" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Transform</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="arrowhead-left" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <polygon points="10 0, 0 3, 10 6" fill="#374151"/>
    </marker>
  </defs>

  <!-- Bottom annotation -->
  <rect x="100" y="300" width="600" height="80" fill="rgba(147,51,234,0.08)" stroke="#9333ea" stroke-width="1.5" rx="3"/>

  <text x="400" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">QM IS FLUID MECHANICS + QUANTUM POTENTIAL</text>

  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#374151">The quantum potential Q is the key difference from classical hydrodynamics.</text>

  <text x="400" y="368" text-anchor="middle" font-size="11" fill="#9333ea" font-weight="bold">It arises from curvature of the probability amplitude √ρ</text>
</svg>