<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>Hawking's Mode Mixing Picture at the Horizon</title>
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 13px; fill: #374151; font-weight: normal; }
      .title { font-family: Arial, sans-serif; font-size: 15px; fill: #374151; font-weight: bold; }
      .small-label { font-family: Arial, sans-serif; font-size: 11px; fill: #374151; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" stroke="none"/>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Horizon Mode Mixing</text>

  <!-- Left region: IN modes -->
  <text x="100" y="60" text-anchor="middle" class="label" font-weight="bold">IN REGION (past)</text>

  <!-- Positive frequency mode (blue) -->
  <path d="M 20 150 Q 35 130, 50 150 T 80 150 T 110 150 T 140 150"
        stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="50" y="120" class="label" fill="#2563eb">ω > 0</text>
  <text x="50" y="135" class="small-label">(positive freq)</text>

  <!-- Negative frequency mode (red dashed) -->
  <path d="M 20 220 Q 35 200, 50 220 T 80 220 T 110 220 T 140 220"
        stroke="#dc2626" stroke-width="2.5" fill="none" stroke-dasharray="5,3" stroke-linecap="round"/>
  <text x="50" y="255" class="label" fill="#dc2626">ω < 0</text>
  <text x="50" y="270" class="small-label">(negative freq)</text>

  <!-- Horizon region: vertical bar -->
  <rect x="370" y="50" width="60" height="300" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="400" y="380" text-anchor="middle" class="label" font-weight="bold">Horizon</text>

  <!-- Right region: OUT mode (mixture) -->
  <text x="680" y="60" text-anchor="middle" class="label" font-weight="bold">OUT REGION (future)</text>

  <!-- Mixed mode (combination of blue and red) -->
  <!-- Blue component -->
  <path d="M 500 150 Q 515 130, 530 150 T 560 150 T 590 150 T 620 150"
        stroke="#2563eb" stroke-width="1.8" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- Red component -->
  <path d="M 500 220 Q 515 200, 530 220 T 560 220 T 590 220 T 620 220"
        stroke="#dc2626" stroke-width="1.8" fill="none" opacity="0.7" stroke-dasharray="5,3" stroke-linecap="round"/>
  <!-- Resultant superposition (darker outline) -->
  <path d="M 500 185 Q 515 160, 530 185 T 560 185 T 590 185 T 620 185"
        stroke="#374151" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <text x="560" y="130" text-anchor="middle" class="label" font-weight="bold">Out mode =</text>
  <text x="560" y="148" text-anchor="middle" class="label" font-weight="bold">α(in⁺) + β(in⁻)</text>

  <!-- Arrow and annotation box -->
  <path d="M 650 185 L 710 185" stroke="#9333ea" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <rect x="720" y="150" width="70" height="70" fill="rgba(147, 51, 234, 0.08)" stroke="#9333ea" stroke-width="1.5" rx="3"/>
  <text x="755" y="170" text-anchor="middle" class="small-label" font-weight="bold">|β|² = particle</text>
  <text x="755" y="185" text-anchor="middle" class="small-label" font-weight="bold">number</text>
  <text x="755" y="202" text-anchor="middle" class="small-label">1/(e^(2πω/κ)-1)</text>
  <text x="755" y="215" text-anchor="middle" class="small-label" font-weight="bold">(Planck!)</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- Arrows from in-modes to horizon -->
  <path d="M 140 150 L 370 150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)" opacity="0.6"/>
  <path d="M 140 220 L 370 220" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)" opacity="0.6"/>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563eb" opacity="0.6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Arrows from horizon to out modes -->
  <path d="M 430 150 L 500 150" stroke="#2563eb" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 430 220 L 500 220" stroke="#dc2626" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 430 185 L 500 185" stroke="#374151" stroke-width="1.5" fill="none"/>

</svg>