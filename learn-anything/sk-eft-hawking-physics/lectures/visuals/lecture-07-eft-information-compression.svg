<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" width="800" height="350">
  <title>EFT as Information Compression</title>

  <!-- Background -->
  <rect width="800" height="350" fill="#ffffff"/>

  <!-- Left side: Microscopic DOF (many dots) -->
  <rect x="20" y="40" width="140" height="200" fill="rgba(107,112,126,0.08)" stroke="#374151" stroke-width="1.5" rx="4"/>
  <text x="90" y="30" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Microscopic</text>

  <!-- Generate grid of dots for 10^23 atoms -->
  <circle cx="40" cy="60" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="60" cy="65" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="80" cy="62" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="100" cy="68" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="120" cy="61" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="140" cy="66" r="2.5" fill="#374151" opacity="0.7"/>

  <circle cx="38" cy="85" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="62" cy="88" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="88" cy="82" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="112" cy="90" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="138" cy="86" r="2.5" fill="#374151" opacity="0.7"/>

  <circle cx="42" cy="110" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="68" cy="108" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="95" cy="115" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="118" cy="112" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="142" cy="109" r="2.5" fill="#374151" opacity="0.7"/>

  <circle cx="48" cy="135" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="75" cy="138" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="102" cy="132" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="125" cy="140" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="145" cy="135" r="2.5" fill="#374151" opacity="0.7"/>

  <circle cx="45" cy="160" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="70" cy="165" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="98" cy="158" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="122" cy="168" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="140" cy="162" r="2.5" fill="#374151" opacity="0.7"/>

  <circle cx="52" cy="190" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="78" cy="192" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="105" cy="188" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="130" cy="195" r="2.5" fill="#374151" opacity="0.7"/>
  <circle cx="150" cy="190" r="2.5" fill="#374151" opacity="0.7"/>

  <text x="90" y="225" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">10²³ atoms</text>

  <!-- Arrow and label: Coarse-grain -->
  <path d="M 165 120 Q 250 80 320 120" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="245" y="75" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">Coarse-grain / Average</text>

  <!-- Center: EFT box -->
  <rect x="320" y="60" width="160" height="120" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="2.5" rx="6"/>
  <text x="400" y="90" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">EFT</text>
  <text x="400" y="112" font-size="12" fill="#2563eb" text-anchor="middle" font-family="monospace">L = P(X) +</text>
  <text x="400" y="130" font-size="12" fill="#2563eb" text-anchor="middle" font-family="monospace">SK dissipation</text>

  <!-- Right side: EFT outputs (three boxes) -->
  <!-- Output 1: Sound speed -->
  <path d="M 480 100 Q 530 90 580 80" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <rect x="580" y="50" width="190" height="60" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1.5" rx="4"/>
  <text x="675" y="72" font-size="11" fill="#374151" text-anchor="middle">Sound speed</text>
  <text x="675" y="90" font-size="11" fill="#16a34a" text-anchor="middle" font-family="monospace">c_s</text>

  <!-- Output 2: Viscosity -->
  <path d="M 480 120 Q 530 120 580 120" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrowhead-purple)"/>
  <rect x="580" y="100" width="190" height="60" fill="rgba(147,51,234,0.1)" stroke="#9333ea" stroke-width="1.5" rx="4"/>
  <text x="675" y="122" font-size="11" fill="#374151" text-anchor="middle">Viscosity coefficients</text>
  <text x="675" y="140" font-size="11" fill="#9333ea" text-anchor="middle" font-family="monospace">γ₁, γ₂</text>

  <!-- Output 3: Equation of state -->
  <path d="M 480 140 Q 530 155 580 165" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)"/>
  <rect x="580" y="150" width="190" height="60" fill="rgba(220,38,38,0.1)" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="675" y="172" font-size="11" fill="#374151" text-anchor="middle">Equation of state</text>
  <text x="675" y="190" font-size="11" fill="#dc2626" text-anchor="middle" font-family="monospace">P(μ)</text>

  <!-- Bottom insight -->
  <text x="400" y="290" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Most Powerful Idea in Physics:</text>
  <text x="400" y="310" font-size="11" fill="#374151" text-anchor="middle">10²³ degrees of freedom → handful of parameters</text>
  <text x="400" y="330" font-size="11" fill="#374151" text-anchor="middle">Universal behavior emerges from microscopic chaos</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9333ea"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>
</svg>