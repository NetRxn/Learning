<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg" width="500" height="600">
  <title>Wilson's RG: Integrating Out High-Energy Modes</title>

  <!-- Background -->
  <rect width="500" height="600" fill="#ffffff"/>

  <!-- UV Region (Top) -->
  <rect x="50" y="20" width="400" height="100" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="2" rx="8"/>
  <text x="250" y="45" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">UV (High Energy, Short Distance)</text>

  <!-- Wiggly lines representing high-energy modes -->
  <path d="M 100 70 Q 110 60 120 70 Q 130 80 140 70 Q 150 60 160 70 Q 170 80 180 70 Q 190 60 200 70"
        stroke="#2563eb" stroke-width="2" fill="none"/>
  <path d="M 220 75 Q 230 65 240 75 Q 250 85 260 75 Q 270 65 280 75 Q 290 85 300 75 Q 310 65 320 75"
        stroke="#2563eb" stroke-width="2" fill="none"/>
  <path d="M 80 90 Q 100 80 120 90 Q 140 100 160 90 Q 180 80 200 90 Q 220 100 240 90 Q 260 80 280 90 Q 300 100 320 90"
        stroke="#2563eb" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Arrow Down -->
  <line x1="250" y1="135" x2="250" y2="180" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="260" y="160" font-size="13" fill="#374151">Integrate out</text>
  <text x="260" y="175" font-size="13" fill="#374151">modes above Λ</text>

  <!-- Cutoff Scale Line -->
  <line x1="80" y1="220" x2="420" y2="220" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="435" y="225" font-size="14" font-weight="bold" fill="#374151">Λ</text>

  <!-- IR Region (Bottom) -->
  <rect x="50" y="250" width="400" height="100" fill="rgba(16,163,74,0.1)" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="250" y="275" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">IR (Low Energy, Long Distance)</text>

  <!-- Smooth curves representing effective degrees of freedom -->
  <path d="M 100 310 Q 150 295 200 310 Q 250 325 300 310 Q 350 295 400 310"
        stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <path d="M 90 325 Q 160 310 230 325 Q 300 340 370 325 Q 420 315 440 320"
        stroke="#16a34a" stroke-width="2" fill="none"/>

  <!-- Annotation Box -->
  <rect x="50" y="380" width="400" height="180" fill="#f9fafb" stroke="#374151" stroke-width="1.5" rx="6"/>
  <text x="60" y="405" font-size="12" font-weight="bold" fill="#374151">Key Insight:</text>
  <text x="60" y="430" font-size="11" fill="#374151">High-energy details → renormalized coefficients</text>
  <text x="60" y="448" font-size="11" fill="#374151">in low-energy theory</text>

  <text x="60" y="475" font-size="12" font-weight="bold" fill="#374151">Why L = P(X) works:</text>
  <text x="60" y="498" font-size="11" fill="#374151">All UV physics → a few renormalized numbers:</text>
  <text x="60" y="518" font-size="11" fill="#2563eb" font-family="monospace">c_s  (sound speed)</text>
  <text x="60" y="538" font-size="11" fill="#2563eb" font-family="monospace">γ₁, γ₂  (viscosities)</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#374151"/>
    </marker>
  </defs>
</svg>