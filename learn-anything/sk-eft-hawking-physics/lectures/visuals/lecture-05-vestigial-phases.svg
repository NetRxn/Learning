<svg viewBox="0 0 600 550" width="600" height="550" xmlns="http://www.w3.org/2000/svg">
  <title>Vestigial Phase Diagram</title>

  <!-- Background -->
  <rect width="600" height="550" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">Vestigial Phase Diagram: Staged Symmetry Breaking</text>

  <!-- Y-axis (Temperature) -->
  <line x1="80" y1="480" x2="80" y2="60" stroke="#374151" stroke-width="2"/>
  <polygon points="80,50 75,65 85,65" fill="#374151"/>
  <text x="35" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle" transform="rotate(-90 35 270)">Temperature (T)</text>

  <!-- X-axis (Control Parameter) -->
  <line x1="80" y1="480" x2="520" y2="480" stroke="#374151" stroke-width="2"/>
  <polygon points="530,480 515,475 515,485" fill="#374151"/>
  <text x="300" y="520" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">Control Parameter (e.g., coupling strength)</text>

  <!-- Axis ticks and labels -->
  <line x1="75" y1="480" x2="85" y2="480" stroke="#374151" stroke-width="1"/>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#374151">0</text>

  <line x1="75" y1="270" x2="85" y2="270" stroke="#374151" stroke-width="1"/>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#374151">T_c2</text>

  <line x1="75" y1="120" x2="85" y2="120" stroke="#374151" stroke-width="1"/>
  <text x="60" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#374151">T_c1</text>

  <!-- Region 1: Disordered (top) -->
  <rect x="80" y="60" width="440" height="120" fill="#f9fafb" stroke="none"/>
  <text x="300" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">Disordered Phase</text>
  <text x="300" y="128" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Full symmetry preserved</text>
  <text x="300" y="143" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">No order parameters</text>

  <!-- Region 2: Vestigial (middle) -->
  <rect x="80" y="180" width="440" height="120" fill="rgba(217,119,6,0.15)" stroke="#d97706" stroke-width="1.5"/>
  <text x="300" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">Vestigial Phase</text>
  <text x="300" y="243" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Partial symmetry breaking</text>
  <text x="300" y="258" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Only composite order parameter condenses</text>

  <!-- Region 3: Fully Ordered (bottom) -->
  <rect x="80" y="300" width="440" height="140" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">Fully Ordered Phase</text>
  <text x="300" y="373" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Complete symmetry breaking</text>
  <text x="300" y="388" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Multiple order parameters condense</text>

  <!-- Phase transition lines -->
  <!-- Upper transition (disordered to vestigial) -->
  <line x1="80" y1="180" x2="520" y2="180" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="535" y="180" font-family="Arial, sans-serif" font-size="10" fill="#d97706" font-weight="bold">T_c1</text>

  <!-- Lower transition (vestigial to ordered) -->
  <line x1="80" y1="300" x2="520" y2="300" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="535" y="300" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="bold">T_c2</text>

  <!-- Annotation box -->
  <rect x="85" y="450" width="430" height="28" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="300" y="468" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Monte Carlo (Paper 5): Split transitions observed at L = 6, 8</text>
</svg>